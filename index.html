<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>חדר בריחה</title><style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071121;color:#e8eef8;font-family:Arial,"Noto Sans Hebrew",sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}.app{width:min(1200px,100%)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#22d3ee;font-weight:900}.stage{position:relative;display:inline-block;max-width:100%;line-height:0}.wrap{text-align:center;background:#050b15;border:1px solid #253754;border-radius:20px;padding:14px;min-height:65vh;display:flex;align-items:center;justify-content:center;flex-direction:column}.stage img{max-width:100%;height:auto;border-radius:12px;display:block}.hot{position:absolute;border:0;background:transparent;border-radius:8px;cursor:pointer;transition:.2s}.hot:hover{background:transparent;box-shadow:none}.endmsg{font-size:28px;color:#86efac;margin-top:18px;font-weight:900}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.modal{width:min(560px,95vw);background:#111b2f;border:1px solid #13c8e8;border-top:5px solid #13c8e8;border-radius:18px;padding:24px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.55)}.modal h2{color:#40dff5;letter-spacing:9px;font-size:30px;margin:8px 0 20px}.qbox{border:1px solid #344765;border-radius:10px;padding:16px;margin-bottom:18px;color:#dbe5f1;background:#132039;line-height:1.5}.modal input{background:#0b1528;color:#e8eef8;border-radius:10px;padding:10px;width:100%;height:58px;text-align:center;font-size:24px;border:2px solid #13c8e8}.actions{display:grid;grid-template-columns:80px 1fr;gap:14px;margin-top:18px}button{cursor:pointer;border:0;border-radius:12px;padding:12px 14px;font-weight:900;color:#fff;background:#0ea5b8;font-size:18px}.close{background:#26364e;font-size:25px}.success{color:#86efac}.error{color:#fca5a5}#msg{min-height:26px;margin-top:10px;font-weight:900}@media(max-width:700px){body{padding:8px}.modal h2{font-size:23px;letter-spacing:4px}}
    </style></head><body><div class="app"><div class="top"><div>חדר בריחה</div><div id="counter"></div></div><div class="wrap"><div id="area"></div></div></div><div class="modal-backdrop" id="modal"><div class="modal"><h2>🔒 המנעול נעול 🔒</h2><div class="qbox">מהי התשובה לחידה זו?</div><input id="ans" placeholder="הקלידו תשובה..." autocomplete="off"><div id="msg"></div><div class="actions"><button class="close" id="close">×</button><button id="check">בדיקת תשובה</button></div></div></div><script>const project={"screens":[{"id":"id_9gm479bfqke","title":"מסך פתיחה","type":"start","imagePath":"start.webp","zones":[{"id":"id_pbugrmifvmv","x":67.14973833278191,"y":67.65017812523733,"w":20,"h":15,"answer":""}]},{"id":"id_imhjhidg00j","title":"מסך 2","type":"riddle","imagePath":"stage2.webp","zones":[{"id":"id_w7h2mixg44x","x":80,"y":67.27489431631999,"w":20,"h":31.137447158159993,"answer":"64"}]},{"id":"id_r00sb05gh66","title":"מסך 3","type":"riddle","imagePath":"stage3.webp","zones":[{"id":"id_ngocfeogo4g","x":80,"y":68.02547625031433,"w":20,"h":31.974523749685673,"answer":"סירקון"}]},{"id":"id_15hua4ch1di","title":"מסך 4","type":"riddle","imagePath":"stage4.webp","zones":[{"id":"id_70gd2ydh7km","x":80,"y":65.77373044833129,"w":20,"h":32.263312901071686,"answer":"איןאין"}]},{"id":"id_k4gn241hf5k","title":"מסך 5","type":"riddle","imagePath":"stage5.webp","zones":[{"id":"id_zkctlufhk39","x":80,"y":62.39614037767603,"w":20,"h":37.32971590225413,"answer":"מראשותיו"}]},{"id":"id_idytsv0hua2","title":"מסך 6","type":"riddle","imagePath":"stage6.webp","zones":[{"id":"id_7eo1999hyyo","x":75.43092576459796,"y":70.84014776567338,"w":22.935105874114544,"h":25.88338793635923,"answer":"ריסי עיניו"}]},{"id":"id_qj8z4fxi9ia","title":"מסך 7","type":"riddle","imagePath":"stage7.webp","zones":[{"id":"id_253s77yiftc","x":78.47086327508971,"y":66.89961050740264,"w":19.790348723542067,"h":32.263327217231335,"answer":"ביטול מלאכה"}]},{"id":"id_gxa84lpiy0t","title":"מסך 8","type":"riddle","imagePath":"stage8.webp","zones":[{"id":"id_5ous3b4j40u","x":40.52412619176208,"y":40.254059221800766,"w":20,"h":21.004626839635463,"answer":"מצוה"}]},{"id":"id_tgd6l9fje4f","title":"מסך 9","type":"end","imagePath":"end.webp","zones":[]}]};let idx=0,active=null;const $=id=>document.getElementById(id);function norm(s){return String(s||'').trim().replace(/\s+/g,' ').replace(/[״"']/g,'').toLowerCase()}function render(){const s=project.screens[idx],area=$('area');$('counter').textContent=(idx+1)+' / '+project.screens.length;area.innerHTML='';if(!s){area.textContent='אין מסכים';return}const st=document.createElement('div');st.className='stage';const img=document.createElement('img');img.src=s.imagePath;st.appendChild(img);img.onload=()=>{const w=img.clientWidth,h=img.clientHeight;(s.zones||[]).forEach(z=>{const hot=document.createElement('div');hot.className='hot';hot.style.right=(z.x*w/100)+'px';hot.style.top=(z.y*h/100)+'px';hot.style.width=(z.w*w/100)+'px';hot.style.height=(z.h*h/100)+'px';hot.onclick=()=>{if(s.type==='start'){idx=Math.min(project.screens.length-1,idx+1);render()}else if(s.type==='riddle'){openModal(z)}};st.appendChild(hot)})};area.appendChild(st);if(s.type==='end'){const m=document.createElement('div');m.className='endmsg';m.textContent='סיימתם את חדר הבריחה!';area.appendChild(m)}}function openModal(z){active=z;$('ans').value='';$('msg').textContent='';$('msg').className='';$('modal').style.display='flex';setTimeout(()=>$('ans').focus(),50)}$('close').onclick=()=>$('modal').style.display='none';$('check').onclick=()=>{if(!active)return;if(norm($('ans').value)===norm(active.answer)){$('msg').textContent='נכון! המנעול נפתח.';$('msg').className='success';setTimeout(()=>{$('modal').style.display='none';idx=Math.min(project.screens.length-1,idx+1);render()},700)}else{$('msg').textContent='התשובה אינה נכונה. נסו שוב.';$('msg').className='error'}};$('ans').addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click()});window.addEventListener('resize',render);render();</script></body></html>
